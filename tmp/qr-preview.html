<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR result screen preview</title>
    <link rel="stylesheet" href="../frontend/style.css">
    <link rel="stylesheet" href="idle-preview.css">
    <style>
        #screen-done { display: flex; }
        #qr-modal-close { cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <div class="screen" id="screen-done">
            <div class="done-row">
                <img src="../frontend/assets/dots.svg" class="dots-anim" alt="">
                <div class="done-title">Идёт печать</div>
            </div>
            <section class="result-qr-panel" id="result-qr-panel" aria-live="polite">
                <div id="result-qr-code" aria-label="QR-код для скачивания оригиналов"></div>
                <p class="result-qr-text">
                    <span>ОРИГИНАЛЫ ФОТО И ВИДЕО</span>
                    <span>БУДУТ ДОСТУПНЫ ЗДЕСЬ</span>
                </p>
            </section>
        </div>

        <div id="qr-modal">
            <button id="qr-modal-close" type="button" aria-label="Скрыть QR-код">×</button>
            <div id="qr-modal-code"></div>
            <div id="qr-modal-text">ОТСКАНИРУЙТЕ, ЧТОБЫ СКАЧАТЬ ФОТО И ВИДЕО</div>
        </div>
    </div>

    <script src="../frontend/assets/qrcode.min.js"></script>
    <script>
        const qr = qrcode(0, "M");
        qr.addData("https://disk.yandex.ru/d/photobooth-preview");
        qr.make();
        const markup = qr.createSvgTag(8);
        document.getElementById("result-qr-code").innerHTML = markup;
        document.getElementById("qr-modal-code").innerHTML = markup;
        document.getElementById("qr-modal-close").addEventListener("click", () => {
            document.getElementById("qr-modal").hidden = true;
        });
    </script>
</body>
</html>
