<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle screen preview</title>
    <link rel="stylesheet" href="../frontend/style.css">
    <link rel="stylesheet" href="idle-preview.css">
</head>
<body>
    <div id="app">
        <div class="screen start-locked" id="screen-idle" aria-disabled="true">
            <div class="idle-pose-field" id="idle-pose-field" aria-hidden="true">
                <div class="idle-pose-row move-left" data-pose-offset="0"></div>
                <div class="idle-pose-row move-right" data-pose-offset="3"></div>
                <div class="idle-pose-row move-left-slow" data-pose-offset="6"></div>
                <div class="idle-pose-row move-right-slow" data-pose-offset="9"></div>
                <div class="idle-pose-row move-left" data-pose-offset="2"></div>
                <div class="idle-pose-row move-right" data-pose-offset="5"></div>
                <div class="idle-pose-row move-left-slow" data-pose-offset="8"></div>
            </div>
            <div class="idle-hero-wrap">
                <!-- <div class="idle-center-fade" aria-hidden="true"></div> -->
                <section class="idle-hero">
                    <!-- Preview keeps the badge visible to demonstrate Café mode. -->
                    <div class="idle-price-badge" id="idle-price-badge">
                        <span>ЦЕНА:</span>
                        <strong id="idle-price-value">100 ₽</strong>
                    </div>
                    <h1>
                        <span class="idle-title-main">ФОТОБУДКА</span>
                        <span class="idle-title-sub">С МОМЕНТАЛЬНОЙ ПЕЧАТЬЮ</span>
                    </h1>
                    <p class="idle-session-info" id="idle-session-info">
                        4 КАДРА С ТАЙМЕРОМ 5 СЕКУНД
                    </p>
                    <!-- <p class="idle-delivery-info" id="idle-delivery-info">
                        ОРИГИНАЛЫ ФОТО И ВИДЕО — ПО QR-КОДУ
                    </p> -->
                    <div class="tap-prompt">
                        <button class="idle-start-button" id="idle-start-button" type="button" tabindex="-1">
                            НАЧАТЬ
                        </button>
                        <div class="tap-lock-status" hidden>(ЗАБЛОКИРОВАНО)</div>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script>
        const poseUrls = Array.from({length: 12}, (_, index) =>
            `../frontend/assets/poses/${String(index + 1).padStart(3, "0")}.png`
        );
        const rows = document.querySelectorAll(".idle-pose-row");
        const sequenceLength = 12;
        const sequenceCopies = 6;

        rows.forEach((row, rowIndex) => {
            const offset = Number(row.dataset.poseOffset || 0);
            const urls = Array.from({length: sequenceLength}, (_, index) =>
                poseUrls[(offset + rowIndex * sequenceLength + index) % poseUrls.length]
            );
            const track = document.createElement("div");
            track.className = "idle-pose-track";
            for (let copy = 0; copy < sequenceCopies; copy++) {
                const sequence = document.createElement("div");
                sequence.className = "idle-pose-sequence";
                urls.forEach(url => {
                    const image = document.createElement("img");
                    image.className = "idle-pose-tile";
                    image.src = url;
                    image.alt = "";
                        image.draggable = false;
                        image.decoding = "async";
                    sequence.appendChild(image);
                });
                track.appendChild(sequence);
            }
            row.replaceChildren(track);
        });
    </script>
</body>
</html>
