name: Build Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: photobooth-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        shell: pwsh
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
        run: |
          $missing = @()
          foreach ($name in @("YADISK_TOKEN", "TG_BOT_TOKEN", "TG_ADMIN_ID")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Secrets: $($missing -join ', ')"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Build embedded Python with all packages
      - name: Build python/ folder
        shell: pwsh
        run: |
          $pyver = "3.12.10"
          # Keep pip/distlib-generated Windows launchers byte-for-byte stable.
          $env:SOURCE_DATE_EPOCH = "315532800"
          $url = "https://www.python.org/ftp/python/$pyver/python-$pyver-embed-amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python
          Remove-Item python-embed.zip
          # Enable site-packages
          $pth = Get-ChildItem python -Filter "python*._pth"
          $content = Get-Content $pth.FullName
          $content = $content -replace '#import site', 'import site'
          $content += "`n..\`n"
          Set-Content $pth.FullName $content
          # Install pip + packages
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          python/python.exe get-pip.py --no-warn-script-location --no-compile
          python/python.exe -m pip install `
            --force-reinstall --no-compile --no-warn-script-location `
            pip==26.2.1 setuptools==83.0.0 wheel==0.46.3
          python/python.exe -m pip install `
            --no-compile --no-warn-script-location -r requirements-win.lock
          Remove-Item get-pip.py

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python/python.exe -m unittest discover -s tests -v

      - name: Build full and component ZIPs
        shell: pwsh
        run: |
          python/python.exe .github/scripts/build_release.py `
            --stage (Join-Path $env:RUNNER_TEMP "photobooth-release-stage") `
            --output dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Auto-built from main branch"
          prerelease: true
          preserve_order: true
          fail_on_unmatched_files: true
          files: |
            dist/photobooth-win.zip
            dist/photobooth-app.zip
            dist/photobooth-assets.zip
            dist/photobooth-python.zip
            dist/photobooth-bin.zip
            dist/photobooth-templates.zip
            dist/photobooth-edsdk.zip
            dist/photobooth-drivers.zip

      - name: Let GitHub release assets settle
        shell: pwsh
        run: Start-Sleep -Seconds 1

      - name: Publish release to Yandex.Disk
        id: publish
        timeout-minutes: 45
        shell: pwsh
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/latest
        run: |
          python/python.exe .github/scripts/publish_release.py `
            --dist-dir dist `
            --metadata dist/release-metadata.json `
            --source-base-url $env:RELEASE_BASE_URL `
            --commit ${{ github.sha }} `
            --folder photobooth_system/updates

      - name: Notify Telegram about successful release
        continue-on-error: true
        shell: pwsh
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          RELEASE_SHA: ${{ steps.publish.outputs.sha256 }}
          RELEASE_SIZE: ${{ steps.publish.outputs.size_mib }}
          PUBLISH_METHOD: ${{ steps.publish.outputs.method }}
          CHANGED_COMPONENTS: ${{ steps.publish.outputs.changed }}
        run: |
          $shortSha = $env:RELEASE_SHA.Substring(0, 16)
          $method = switch ($env:PUBLISH_METHOD) {
            "server-side-import" { "импорт по GitHub-ссылке" }
            default { "архивы уже были опубликованы" }
          }
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $text = "✅ Новый релиз фотобудки опубликован на Яндекс.Диск`n" +
                  "ZIP: $env:RELEASE_SIZE MiB`n" +
                  "SHA: $shortSha`n" +
                  "Изменились: $env:CHANGED_COMPONENTS`n" +
                  "Способ: $method`n`n" +
                  "Для установки отправь /restart`n`n$runUrl"
          $body = @{ chat_id = $env:TG_ADMIN_ID; text = $text } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$env:TG_BOT_TOKEN/sendMessage" `
            -Method Post `
            -ContentType "application/json; charset=utf-8" `
            -Body $body

      - name: Notify Telegram about failed release
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
        run: |
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $text = "❌ Сборка или публикация релиза фотобудки не удалась.`n$runUrl"
          $body = @{ chat_id = $env:TG_ADMIN_ID; text = $text } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$env:TG_BOT_TOKEN/sendMessage" `
            -Method Post `
            -ContentType "application/json; charset=utf-8" `
            -Body $body
