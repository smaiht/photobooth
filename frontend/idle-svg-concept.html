<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth idle cartoon</title>
    <style>
        /* Preview shell only. It is not needed when the component is embedded. */
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            padding: 2vw;
            overflow: hidden;
            background: #fbfaf8;
            font-family: "Comfortaa", sans-serif;
        }

        /* Embeddable component. Animation timing is configured at the bottom. */
        .idle-process-cartoon {
            --ipc-ink: #191918;
            --ipc-green: #173b29;
            --ipc-wine: #750d22;
            --ipc-red: #d83434;
            width: 100%;
            max-width: 1600px;
            aspect-ratio: 1200 / 700;
            overflow: hidden;
            border-radius: clamp(20px, 2vw, 38px);
            background: linear-gradient(155deg, #f8f4ec, #e9e2d8);
        }

        .idle-process-cartoon svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .idle-process-cartoon text {
            font-family: inherit;
        }

        /* Static appearance only. All timing lives in TIMELINE at the bottom. */
        .idle-process-cartoon .ipc-progress-fill {
            stroke-dasharray: 980;
            stroke-dashoffset: 980;
        }

        .idle-process-cartoon .ipc-guest-a,
        .idle-process-cartoon .ipc-guest-b {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        .idle-process-cartoon .ipc-caption,
        .idle-process-cartoon .ipc-screen-state,
        .idle-process-cartoon .ipc-rest-arms-a,
        .idle-process-cartoon .ipc-rest-arms-b,
        .idle-process-cartoon .ipc-action-arm,
        .idle-process-cartoon .ipc-celebration-arms,
        .idle-process-cartoon .ipc-pose-one,
        .idle-process-cartoon .ipc-pose-two,
        .idle-process-cartoon .ipc-pose-three,
        .idle-process-cartoon .ipc-pose-four,
        .idle-process-cartoon .ipc-shooting-only,
        .idle-process-cartoon .ipc-shot-counter,
        .idle-process-cartoon .ipc-shot-flash,
        .idle-process-cartoon .ipc-start-tap-ring,
        .idle-process-cartoon .ipc-choice-tap,
        .idle-process-cartoon .ipc-choice-selector,
        .idle-process-cartoon .ipc-print-sheet-source,
        .idle-process-cartoon .ipc-print-sheet-foreground,
        .idle-process-cartoon .ipc-confetti {
            opacity: 0;
        }

        .idle-process-cartoon .ipc-pose-one,
        .idle-process-cartoon .ipc-pose-two,
        .idle-process-cartoon .ipc-pose-three,
        .idle-process-cartoon .ipc-pose-four {
            visibility: hidden;
        }

        .idle-process-cartoon .ipc-start-tap-ring,
        .idle-process-cartoon .ipc-choice-tap {
            fill: none;
            stroke-width: 5;
            transform-box: fill-box;
            transform-origin: center;
        }

        .idle-process-cartoon .ipc-start-tap-ring {
            stroke: var(--ipc-red);
        }

        .idle-process-cartoon .ipc-choice-tap,
        .idle-process-cartoon .ipc-choice-selector {
            stroke: var(--ipc-wine);
        }

        .idle-process-cartoon .ipc-choice-selector {
            fill: none;
            stroke-width: 5;
            transform-box: fill-box;
            transform-origin: center;
        }

        .idle-process-cartoon .ipc-countdown {
            fill: #fff;
            font-size: 112px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: middle;
            opacity: 0;
            filter: url(#ipc-count-shadow);
            transform-box: fill-box;
            transform-origin: center;
        }

        .idle-process-cartoon .ipc-print-sheet-source,
        .idle-process-cartoon .ipc-print-sheet-foreground,
        .idle-process-cartoon .ipc-qr,
        .idle-process-cartoon .ipc-confetti {
            transform-box: fill-box;
            transform-origin: center;
        }
    </style>
</head>
<body>
    <!-- Component start: this div can be moved into the production idle screen. -->
    <div class="idle-process-cartoon">

             aria-label="Гости делают четыре кадра, выбирают формат и забирают напечатанное фото">

                    <stop offset="0" stop-color="#f0c78f"/>
                    <stop offset="0.5" stop-color="#dca568"/>
                    <stop offset="1" stop-color="#bd7840"/>
                </linearGradient>
                <linearGradient id="ipc-wood-dark" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#6d371b"/>
                    <stop offset="0.55" stop-color="#3f2113"/>
                    <stop offset="1" stop-color="#26140d"/>

                <radialGradient id="ipc-dish" cx="52%" cy="48%" r="58%">

                    <stop offset="0" stop-color="#b8d5c1"/>
                    <stop offset="1" stop-color="#739781"/>
                </linearGradient>
                <linearGradient id="ipc-photo" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#efc3ba"/>
                    <stop offset="0.55" stop-color="#c97976"/>
                    <stop offset="1" stop-color="#713047"/>
                </linearGradient>
                <linearGradient id="ipc-paper" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#fff"/>
                    <stop offset="1" stop-color="#eee7dc"/>
                </linearGradient>
                <pattern id="ipc-wood-grain" width="90" height="70" patternUnits="userSpaceOnUse">
                    <path d="M-8 18Q22 2 55 18T102 12M-15 49Q18 35 45 50T105 44"
                          fill="none" stroke="#7f4525" stroke-width="2" opacity="0.18"/>
                    <path d="M25 0Q33 20 25 39T28 72M71 0Q63 18 71 36T68 72"
                          fill="none" stroke="#fff1d5" stroke-width="1.5" opacity="0.2"/>

                <filter id="ipc-booth-shadow" x="-30%" y="-25%" width="170%" height="175%">
                    <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#38271d" flood-opacity="0.24"/>

                <filter id="ipc-count-shadow" x="-50%" y="-50%" width="200%" height="200%">

                </filter>
                <clipPath id="ipc-screen-clip">
                    <rect x="840" y="275" width="420" height="195" rx="13"/>

                <!-- One postcard artwork is reused behind and in front of the booth. -->

                    <rect x="836" y="411" width="61" height="32" rx="4" fill="url(#ipc-photo)"/>
                    <rect x="903" y="411" width="61" height="32" rx="4" fill="#9bbca6"/>
                    <rect x="836" y="449" width="61" height="32" rx="4" fill="#9bbca6"/>
                    <rect x="903" y="449" width="61" height="32" rx="4" fill="url(#ipc-photo)"/>
                    <text x="900" y="501" fill="#750d22" font-size="10" font-weight="700"
                          letter-spacing="1" text-anchor="middle">ОТКРЫТКА</text>
                </g>
            </defs>

            <g aria-hidden="true" transform="translate(0 10)">

                <path class="ipc-progress-fill" d="M210 20H1190" fill="none" stroke="#750d22" stroke-width="7" stroke-linecap="round"/>
                <g fill="#f8f4ec" stroke="#750d22" stroke-width="4">

                    <circle cx="863" cy="20" r="10"/>

                </g>
                <g fill="#4f4943" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">
                    <text x="210" y="49">НАЧАТЬ</text>
                    <text x="537" y="49">4 КАДРА</text>
                    <text x="863" y="49">ВЫБОР</text>
                    <text x="1190" y="49">ГОТОВО</text>
                </g>
            </g>

            <!-- Booth and guests are centered together as one composition. -->
            <g transform="translate(-160 100)">

                <path d="M70 550H1340" stroke="rgba(74,61,50,.2)" stroke-width="4" stroke-linecap="round" transform="translate(160 0)"/>

                <!-- This copy emerges from behind the booth. -->

                    <g class="ipc-screen-state ipc-screen-live">

    <script>
        (() => {
            /*
             * EDIT ONLY THIS OBJECT.
             *
             * All numbers are seconds relative to their stage.
             * Every [from, to] pair is a local animation interval.
             * Total duration is calculated automatically:
             * start + (shotDuration × count) + choice + done.
             */
            const TIMELINE = {
                start: {
                    duration: 2.6,
                    guestAEnter: [0.10, 0.80],
                    guestBEnter: [0.20, 0.90],
                    approach: [1.00, 1.50],
                    arm: [1.20, 2.00],
                    press: [1.60, 1.90],
                    return: [2.00, 2.50],
                },

                shots: {
                    count: 4,
                    shotDuration: 1.5,
                    three: [0.00, 0.40],
                    two: [0.45, 0.85],
                    one: [0.90, 1.28],
                    flash: [1.25, 1.45],
                    flashPeak: 1.32,
                },

                choice: {
                    duration: 3.0,
                    approach: [0.60, 1.20],
                    arm: [0.90, 1.50],
                    press: [1.20, 1.50],
                    return: [1.70, 2.10],
                    selected: [1.50, 3.00],
                },

                done: {
                    duration: 5.5,
                    printBack: [0.20, 1.90],
                    printFront: [1.90, 3.40],
                    confetti: [0.30, 2.50],
                    confettiStagger: 0.08,
                    celebrate: [0.30, 5.00],
                    exit: [5.00, 5.50],
                },
            };

            /* Animation engine below. It uses TIMELINE; normally do not edit it. */
            const STAGE_ORDER = ["start", "shots", "choice", "done"];
            const STAGES = {};
            let cursor = 0;

            for (const name of STAGE_ORDER) {
                const config = TIMELINE[name];
                const duration = name === "shots"
                    ? config.count * config.shotDuration
                    : config.duration;

                STAGES[name] = { from: cursor, to: cursor + duration, duration };
                cursor += duration;
            }

            const TOTAL = cursor;
            const EPSILON = 0.001;
            const stageTime = (stage, local = 0) => STAGES[stage].from + local;
            const frame = (at, styles, easing) => ({
                at,
                ...styles,
                ...(easing ? { easing } : {}),
            });

            document.querySelectorAll(".idle-process-cartoon").forEach(root => {
                const animations = [];

                function elements(target) {
                    if (typeof target === "string") {
                        return [...root.querySelectorAll(target)];
                    }
                    return target instanceof Element ? [target] : [...target];
                }

                function play(target, sourceFrames) {
                    const byTime = new Map();

                    sourceFrames
                        .slice()
                        .sort((a, b) => a.at - b.at)
                        .forEach(item => byTime.set(item.at, item));

                    const keyframes = [...byTime.values()].map(({ at, ...styles }) => ({
                        ...styles,
                        offset: Math.max(0, Math.min(1, at / TOTAL)),
                    }));

                    for (const element of elements(target)) {
                        animations.push(element.animate(keyframes, {
                            duration: TOTAL * 1000,
                            iterations: Infinity,
                            fill: "both",
                            easing: "linear",
                        }));
                    }
                }

                function opacityWindows(intervals, fade = 0.08, extraOn = {}, extraOff = {}) {
                    const off = { opacity: 0, ...extraOff };
                    const on = { opacity: 1, ...extraOn };
                    const frames = [frame(0, off)];

                    for (const [from, to] of intervals) {
                        if (from === 0) {
                            frames.push(frame(0, on));
                        } else {
                            frames.push(frame(Math.max(0, from - fade), off));
                            frames.push(frame(from, on));
                        }

                        frames.push(frame(Math.max(from, to - fade), on));
                        frames.push(frame(to, off));
                    }

                    frames.push(frame(TOTAL, off));
                    return frames;
                }

                function pulseFrames(intervals, enterScale = 0.78, exitScale = 1.18) {
                    const frames = [frame(0, { opacity: 0, transform: `scale(${enterScale})` })];

                    for (const [from, to] of intervals) {
                        const fade = Math.min(0.05, (to - from) / 4);
                        frames.push(frame(from, { opacity: 0, transform: `scale(${enterScale})` }));
                        frames.push(frame(from + fade, { opacity: 1, transform: "scale(1)" }));
                        frames.push(frame(to - fade, { opacity: 1, transform: "scale(1)" }));
                        frames.push(frame(to, { opacity: 0, transform: `scale(${exitScale})` }));
                    }

                    frames.push(frame(TOTAL, { opacity: 0, transform: `scale(${enterScale})` }));
                    return frames;
                }

                function ringFrames(from, to) {
                    const length = to - from;
                    return [
                        frame(0, { opacity: 0, transform: "scale(.3)" }),
                        frame(from, { opacity: 0, transform: "scale(.3)" }),
                        frame(from + length * 0.25, { opacity: 0.9, transform: "scale(.45)" }),
                        frame(to, { opacity: 0, transform: "scale(1.7)" }),
                        frame(TOTAL, { opacity: 0, transform: "scale(.3)" }),
                    ];
                }

                const start = TIMELINE.start;
                const shots = TIMELINE.shots;
                const choice = TIMELINE.choice;
                const done = TIMELINE.done;

                const shotIntervals = Array.from({ length: shots.count }, (_, index) => {
                    const from = STAGES.shots.from + index * shots.shotDuration;
                    return [from, from + shots.shotDuration];
                });

                const localShotIntervals = local => shotIntervals.map(([from]) => [
                    from + local[0],
                    from + local[1],
                ]);

                /* Stage screens, captions and top progress. */
                for (const name of STAGE_ORDER) {
                    const interval = [[STAGES[name].from, STAGES[name].to]];
                    play(`.ipc-screen-${name === "shots" ? "live" : name}`, opacityWindows(interval));
                    play(`.ipc-caption-${name === "shots" ? "live" : name}`, opacityWindows(interval));
                }

                play(".ipc-progress-fill", [
                    frame(0, { strokeDashoffset: 980 }),
                    frame(STAGES.start.to, { strokeDashoffset: 653 }),
                    frame(STAGES.shots.to, { strokeDashoffset: 327 }),
                    frame(STAGES.choice.to, { strokeDashoffset: 0 }),
                    frame(TOTAL, { strokeDashoffset: 0 }),
                ]);

                /* Guests: enter, approach, press, return, celebrate, exit. */
                const neutral = "translate(0px, 0px) rotate(0deg)";
                const hiddenA = { opacity: 0, transform: "translateX(-90px)" };
                const hiddenB = { opacity: 0, transform: "translateX(-105px)" };
                const visible = { opacity: 1, transform: neutral };
                const celebrateFrom = stageTime("done", done.celebrate[0]);
                const celebrateTo = stageTime("done", done.celebrate[1]);
                const exitFrom = stageTime("done", done.exit[0]);
                const exitTo = stageTime("done", done.exit[1]);

                play(".ipc-guest-a", [
                    frame(0, hiddenA),
                    frame(start.guestAEnter[0], hiddenA, "ease-in-out"),
                    frame(start.guestAEnter[1], visible),
                    frame(celebrateFrom, visible, "ease-in-out"),
                    frame(celebrateFrom + 0.35, { opacity: 1, transform: "translate(0px, -11px) rotate(-2deg)" }, "ease-in-out"),
                    frame(celebrateFrom + 0.95, { opacity: 1, transform: "translate(0px, 0px) rotate(2deg)" }, "ease-in-out"),
                    frame(celebrateFrom + 1.45, { opacity: 1, transform: "translate(0px, -6px) rotate(0deg)" }, "ease-in-out"),
                    frame(celebrateTo, visible),
                    frame(exitFrom, visible, "ease-in-out"),
                    frame(exitTo, { opacity: 0, transform: "translateX(-30px)" }),
                ]);

                const choiceApproach = choice.approach.map(value => stageTime("choice", value));
                const choicePress = choice.press.map(value => stageTime("choice", value));
                const choiceReturn = choice.return.map(value => stageTime("choice", value));

                play(".ipc-guest-b", [
                    frame(0, hiddenB),
                    frame(start.guestBEnter[0], hiddenB, "ease-in-out"),
                    frame(start.guestBEnter[1], visible),
                    frame(start.approach[0], visible, "ease-in-out"),
                    frame(start.approach[1], { opacity: 1, transform: "translateX(220px)" }),
                    frame(start.press[1], { opacity: 1, transform: "translateX(220px)" }, "ease-in-out"),
                    frame(start.return[1], visible),
                    frame(choiceApproach[0], visible, "ease-in-out"),
                    frame(choiceApproach[1], { opacity: 1, transform: "translateX(210px)" }),
                    frame(choicePress[1], { opacity: 1, transform: "translateX(210px)" }, "ease-in-out"),
                    frame(choiceReturn[1], visible),
                    frame(celebrateFrom, visible, "ease-in-out"),
                    frame(celebrateFrom + 0.35, { opacity: 1, transform: "translate(8px, -11px) rotate(2deg)" }, "ease-in-out"),
                    frame(celebrateFrom + 0.95, { opacity: 1, transform: "translate(8px, 0px) rotate(-2deg)" }, "ease-in-out"),
                    frame(celebrateFrom + 1.45, { opacity: 1, transform: "translate(8px, -6px)" }, "ease-in-out"),
                    frame(celebrateTo, visible),
                    frame(exitFrom, visible, "ease-in-out"),
                    frame(exitTo, { opacity: 0, transform: "translateX(-30px)" }),
                ]);

                const startArm = start.arm;
                const globalChoicePress = choice.press.map(value => stageTime("choice", value));
                const globalChoiceArm = choice.arm.map(value => stageTime("choice", value));

                play(".ipc-rest-arms-a", opacityWindows([
                    [0, STAGES.shots.from],
                    [STAGES.shots.to, celebrateFrom],
                    [celebrateTo, exitFrom],
                ], EPSILON));

                play(".ipc-rest-arms-b", opacityWindows([
                    [0, startArm[0]],
                    [startArm[1], STAGES.shots.from],
                    [STAGES.shots.to, globalChoiceArm[0]],
                    [globalChoiceArm[1], celebrateFrom],
                    [celebrateTo, exitFrom],
                ], EPSILON));

                play(".ipc-action-arm", opacityWindows([
                    startArm,
                    globalChoiceArm,
                ], EPSILON));

                play(".ipc-celebration-arms", opacityWindows([
                    [celebrateFrom, celebrateTo],
                ], EPSILON));

                /* Four poses, counters, 3-2-1 and flash. */
                const poseNames = ["one", "two", "three", "four"];
                poseNames.forEach((name, index) => {
                    const interval = [shotIntervals[index]];
                    play(`.ipc-pose-${name}`, opacityWindows(
                        interval,
                        EPSILON,
                        { visibility: "visible" },
                        { visibility: "hidden" },
                    ));
                    play(`.ipc-counter-${name}`, opacityWindows(interval, EPSILON));
                });

                play(".ipc-shooting-only", opacityWindows([[
                    STAGES.shots.from,
                    STAGES.shots.to,
                ]]));

                play(".ipc-count-three", pulseFrames(localShotIntervals(shots.three), 1, 1.18));
                play(".ipc-count-two", pulseFrames(localShotIntervals(shots.two)));
                play(".ipc-count-one", pulseFrames(localShotIntervals(shots.one)));

                const flashFrames = [frame(0, { opacity: 0 })];
                shotIntervals.forEach(([from]) => {
                    flashFrames.push(
                        frame(from + shots.flash[0], { opacity: 0 }),
                        frame(from + shots.flashPeak, { opacity: 0.94 }),
                        frame(from + shots.flash[1], { opacity: 0 }),
                    );
                });
                flashFrames.push(frame(TOTAL, { opacity: 0 }));
                play(".ipc-shot-flash", flashFrames);

                /* Tap feedback and selected print format. */
                play(".ipc-start-tap-ring", ringFrames(start.press[0], start.press[1]));
                play(".ipc-choice-tap", ringFrames(globalChoicePress[0], globalChoicePress[1]));
                play(".ipc-choice-selector", opacityWindows([[
                    stageTime("choice", choice.selected[0]),
                    stageTime("choice", choice.selected[1]),
                ]]));

                /* Done: QR, print delivery, confetti and final hold. */
                const printBack = done.printBack.map(value => stageTime("done", value));
                const printFront = done.printFront.map(value => stageTime("done", value));

                play(".ipc-print-sheet-source", [
                    frame(0, { opacity: 0, transform: "translate(0px, 0px) rotate(0deg)" }),
                    frame(printBack[0], { opacity: 0, transform: "translate(0px, 0px) rotate(0deg)" }),
                    frame(printBack[0] + 0.35, { opacity: 1, transform: "translate(-18px, 0px) rotate(0deg)" }),
                    frame(printBack[1], { opacity: 1, transform: "translate(-112px, 4px) rotate(-3deg)" }),
                    frame(printBack[1] + 0.02, { opacity: 0, transform: "translate(-112px, 4px) rotate(-3deg)" }),
                    frame(TOTAL, { opacity: 0, transform: "translate(-112px, 4px) rotate(-3deg)" }),
                ]);

                play(".ipc-print-sheet-foreground", [
                    frame(0, { opacity: 0, transform: "translate(-112px, 4px) scale(1) rotate(-3deg)" }),
                    frame(printFront[0], { opacity: 0, transform: "translate(-112px, 4px) scale(1) rotate(-3deg)" }),
                    frame(printFront[0] + 0.02, { opacity: 1, transform: "translate(-112px, 4px) scale(1) rotate(-3deg)" }),
                    frame(printFront[1], { opacity: 1, transform: "translate(-320px, -110px) scale(2.15) rotate(-4deg)" }),
                    frame(exitFrom, { opacity: 1, transform: "translate(-320px, -110px) scale(2.15) rotate(-4deg)" }),
                    frame(exitTo, { opacity: 0, transform: "translate(-330px, -112px) scale(2.15) rotate(-4deg)" }),
                ]);

                play(".ipc-qr", [
                    frame(0, { transform: "scale(1)" }),
                    frame(STAGES.done.from + 0.4, { transform: "scale(1)" }, "ease-in-out"),
                    frame(STAGES.done.from + 1.1, { transform: "scale(1.025)" }),
                    frame(exitFrom, { transform: "scale(1.025)" }, "ease-in-out"),
                    frame(exitTo, { transform: "scale(1)" }),
                ]);

                root.querySelectorAll(".ipc-confetti").forEach((element, index) => {
                    const from = stageTime("done", done.confetti[0]) + index * done.confettiStagger;
                    const to = stageTime("done", done.confetti[1]) + index * done.confettiStagger;
                    play(element, [
                        frame(0, { opacity: 0, transform: "translateY(-20px) rotate(0deg)" }),
                        frame(from, { opacity: 0, transform: "translateY(-20px) rotate(0deg)" }),
                        frame(from + 0.35, { opacity: 1, transform: "translateY(0px) rotate(0deg)" }),
                        frame(to - 0.35, { opacity: 0.65, transform: "translateY(62px) rotate(140deg)" }),
                        frame(to, { opacity: 0, transform: "translateY(72px) rotate(160deg)" }),
                        frame(TOTAL, { opacity: 0, transform: "translateY(72px) rotate(160deg)" }),
                    ]);
                });

                /* Start every track on the same document-timeline tick. */
                const commonStart = document.timeline.currentTime;
                animations.forEach(animation => { animation.startTime = commonStart; });

                const controller = {
                    config: TIMELINE,
                    stages: STAGES,
                    duration: TOTAL,
                    pause: () => animations.forEach(animation => animation.pause()),
                    play: () => animations.forEach(animation => animation.play()),
                    seek: seconds => animations.forEach(animation => {
                        animation.currentTime = ((seconds % TOTAL) + TOTAL) % TOTAL * 1000;
                    }),
                };

                root.idleTimeline = controller;
                window.idleTimeline = controller;

                if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                    controller.pause();
                    controller.seek(0);
                }
            });
        })();
    </script>
    <!-- Component end. -->
</body>
</html>
