<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- NO CAMERA -->
        <div class="screen" id="screen-no-camera" hidden>
            <div class="error-msg" id="camera-status-title">КАМЕРА НЕ ПОДКЛЮЧЕНА</div>
            <div class="error-sub" id="camera-status-subtitle" aria-live="polite">Подключите камеру</div>
            <button class="camera-recover-button" id="camera-recover-button" type="button">
                ПЕРЕПОДКЛЮЧИТЬ КАМЕРУ
            </button>
        </div>

        <!-- IDLE -->
        <div class="screen" id="screen-idle">
            <div class="idle-pose-field" id="idle-pose-field" aria-hidden="true">
                <div class="idle-pose-row move-left" data-pose-offset="0"></div>
                <div class="idle-pose-row move-right" data-pose-offset="3"></div>
                <div class="idle-pose-row move-left-slow" data-pose-offset="6"></div>
                <div class="idle-pose-row move-right-slow" data-pose-offset="9"></div>
                <div class="idle-pose-row move-left" data-pose-offset="2"></div>
                <div class="idle-pose-row move-right" data-pose-offset="5"></div>
                <div class="idle-pose-row move-left-slow" data-pose-offset="8"></div>
            </div>

            <div class="idle-hero-wrap">
                <!-- <div class="idle-center-fade" aria-hidden="true"></div> -->
                <section class="idle-hero">
                    <div class="idle-price-badge" id="idle-price-badge" hidden>
                        <span>ЦЕНА:</span>
                        <strong id="idle-price-value">100 ₽</strong>
                    </div>
                    <h1>
                        <span class="idle-title-main">ФОТОБУДКА</span>
                        <span class="idle-title-sub">МОМЕНТАЛЬНАЯ ПЕЧАТЬ</span>
                    </h1>
                    <p class="idle-session-info" id="idle-session-info">
                        4 КАДРА С ТАЙМЕРОМ 5 СЕКУНД
                    </p>
                    <div class="tap-prompt">
                        <button class="idle-start-button" id="idle-start-button" type="button" tabindex="-1" disabled>
                            НАЧАТЬ
                        </button>
                        <div class="tap-lock-status">(ЗАБЛОКИРОВАНО)</div>
                    </div>
                </section>
            </div>
        </div>

        <!-- SHOOTING: live view + countdown + flash -->
        <div class="screen" id="screen-shooting" hidden>
            <div id="shooting-stage">
                <aside class="pose-rail" id="pose-rail-left" aria-label="Примеры поз слева"></aside>
                <div id="live-view-frame">
                    <img id="live-view" alt="Изображение с камеры">
                    <div id="countdown-number"></div>
                    <div id="photo-counter"></div>
                </div>
                <aside class="pose-rail" id="pose-rail-right" aria-label="Примеры поз справа"></aside>
            </div>
            <div id="lens-hint" aria-label="Смотрите в объектив">
                <svg class="lens-hint-arrow" viewBox="0 0 60 48" aria-hidden="true" focusable="false">
                    <path d="M30 2 59 23H40V46H20V23H1Z" />
                </svg>
                <span>СМОТРИТЕ В ОБЪЕКТИВ</span>
                <svg class="lens-hint-arrow" viewBox="0 0 60 48" aria-hidden="true" focusable="false">
                    <path d="M30 2 59 23H40V46H20V23H1Z" />
                </svg>
            </div>
        </div>

        <!-- PROCESSING: build real previews from this session -->
        <div class="screen" id="screen-processing" hidden>
            <div class="processing-row">
                <img src="../assets/dots.svg" class="dots-anim" alt="">
                <div class="processing-title">Обрабатываем фото…</div>
            </div>
        </div>

        <!-- TEMPLATE SELECT -->
        <div class="screen" id="screen-template" hidden>
            <div class="template-multi-group" id="template-multi-group" hidden>
                <button id="template-multi" type="button" aria-pressed="false"
                        aria-label="Выбрать несколько отпечатков">
                    <!-- Two sheets: the front one is a full rectangle, the back
                         one only its visible corner, so no strokes cross. -->
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                        <rect x="3" y="8" width="13" height="13" rx="2.4"
                              stroke="currentColor" stroke-width="2"/>
                        <path d="M8 8V7a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-1"
                              stroke="currentColor" stroke-width="2"
                              stroke-linecap="round"/>
                    </svg>
                </button>
                <span class="template-multi-label" aria-hidden="true"></span>
            </div>
            <div class="template-skip-group">
                <span class="template-skip-label" aria-hidden="true">ФОТКАТЬ ЗАНОВО</span>
                <button id="template-skip" type="button" aria-label="Фоткать заново">×</button>
            </div>
            <div class="template-main" id="template-main">
                <div class="template-title">ВЫБЕРИТЕ ФОРМАТ</div>
                <div class="template-options" id="template-options"></div>
            </div>
            <section class="photo-choice-panel" id="photo-choice-panel" hidden>
                <div class="photo-choice-header">
                    <h2>ВЫБЕРИТЕ ФОТО ДЛЯ ПЕЧАТИ</h2>
                    <div class="frame-segments" role="group" aria-label="Рамка фотографии">
                        <button class="frame-segment active" id="frame-on" type="button" aria-pressed="true">С РАМКОЙ</button>
                        <button class="frame-segment" id="frame-off" type="button" aria-pressed="false">БЕЗ РАМКИ</button>
                    </div>
                </div>
                <div class="photo-choice-options" id="photo-choice-options"></div>
            </section>
            <button id="template-print" type="button" hidden disabled>
                <span class="template-print-title">ПЕЧАТАТЬ</span>
                <span class="template-print-count" id="template-print-count">0</span>
            </button>
            <div id="template-timer"></div>
            <!-- Magnifier: only rendered when a photo_choice template exists,
                 because its per-photo previews are what the gallery shows. -->
            <button id="template-zoom" type="button" hidden
                    aria-label="Рассмотреть кадры" aria-expanded="false"
                    aria-controls="photo-viewer">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                    <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor"
                            stroke-width="2.2"/>
                    <path d="M15.5 15.5 21 21" stroke="currentColor"
                          stroke-width="2.2" stroke-linecap="round"/>
                </svg>
            </button>
            <section class="photo-viewer" id="photo-viewer" hidden
                     aria-label="Просмотр кадров">
                <div class="photo-viewer-stage">
                    <button class="photo-viewer-nav prev" id="photo-viewer-prev"
                            type="button" aria-label="Предыдущий кадр">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                            <path d="M15 4 7 12l8 8" stroke="currentColor"
                                  stroke-width="2.4" stroke-linecap="round"
                                  stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="photo-viewer-viewport" id="photo-viewer-viewport">
                        <img id="photo-viewer-image" alt="" draggable="false">
                    </div>
                    <button class="photo-viewer-nav next" id="photo-viewer-next"
                            type="button" aria-label="Следующий кадр">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                            <path d="M9 4l8 8-8 8" stroke="currentColor"
                                  stroke-width="2.4" stroke-linecap="round"
                                  stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div class="photo-viewer-thumbs" id="photo-viewer-thumbs"></div>
            </section>
        </div>

        <!-- DONE: printing status -->
        <div class="screen" id="screen-done" hidden>
            <div class="done-row">
                <img src="../assets/dots.svg" class="dots-anim">
                <div class="done-title" id="done-title">Идёт печать</div>
            </div>
            <section class="result-qr-panel" id="result-qr-panel" aria-live="polite" hidden>
                <div id="result-qr-code" aria-label="QR-код для скачивания оригиналов"></div>
                <p class="result-qr-text">
                    <span>ОРИГИНАЛЫ ФОТО И ВИДЕО</span>
                    <span>БУДУТ ДОСТУПНЫ ЗДЕСЬ</span>
                </p>
            </section>
        </div>

        <!-- QR modal (persists across screens) -->
        <div id="qr-modal" hidden>
            <button id="qr-modal-close" type="button" aria-label="Скрыть QR-код">×</button>
            <div id="qr-modal-code"></div>
            <div id="qr-modal-text"></div>
        </div>

        <div id="flash-overlay"></div>
    </div>

    <script src="../assets/qrcode.min.js"></script>
    <script src="../assets/dev/preview.js"></script>
    <script src="app.js"></script>
</body>
</html>
